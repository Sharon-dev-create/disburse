<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Disburse — accountable payout operations</title>
  <desc id="desc">A forest-green banner with the Disburse wordmark, the line “Move money with confidence,” and an illustrative campaign accounting card showing budget, funded, reserved, and available amounts.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c5a42"/>
      <stop offset="0.55" stop-color="#246b50"/>
      <stop offset="1" stop-color="#1b513c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7e3bd"/>
      <stop offset="0.62" stop-color="#d7e3bd"/>
      <stop offset="0.62" stop-color="#e9c9a8"/>
      <stop offset="0.79" stop-color="#e9c9a8"/>
      <stop offset="0.79" stop-color="#c98f6b"/>
      <stop offset="1" stop-color="#c98f6b"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#f8f7f3" opacity="0.10"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0c281a" flood-opacity="0.28"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="1010" y="70" width="520" height="320" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grain)"/>

  <!-- Decorative orbit -->
  <g fill="none" stroke="#f8f7f3" stroke-opacity="0.12">
    <circle cx="1270" cy="230" r="270"/>
    <circle cx="1270" cy="230" r="340"/>
    <circle cx="1270" cy="230" r="410"/>
  </g>
  <circle cx="1530" cy="80" r="6" fill="#d7e3bd" opacity="0.85"/>
  <circle cx="965" cy="390" r="4" fill="#f8f7f3" opacity="0.55"/>

  <!-- Wordmark -->
  <g transform="translate(88 82)">
    <rect x="0" y="0" width="236" height="30" rx="15" fill="#f8f7f3" fill-opacity="0.10" stroke="#f8f7f3" stroke-opacity="0.22"/>
    <text x="118" y="20" text-anchor="middle" fill="#f8f7f3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.6">PAYOUT ORCHESTRATION</text>

    <text x="0" y="112" fill="#f8f7f3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-4">Disburse</text>
    <text x="2" y="171" fill="#d7e3bd" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic">Move money with confidence.</text>
    <text x="3" y="215" fill="#f8f7f3" fill-opacity="0.82" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19">Campaign funding, budget controls, and accountable payout records.</text>

    <g transform="translate(3 258)" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#f8f7f3" fill-opacity="0.72">
      <text x="0" y="0">NEAR</text>
      <line x1="58" y1="-4" x2="88" y2="-4" stroke="#f8f7f3" stroke-opacity="0.35"/>
      <text x="104" y="0">BUDGETS</text>
      <line x1="184" y1="-4" x2="214" y2="-4" stroke="#f8f7f3" stroke-opacity="0.35"/>
      <text x="230" y="0">PAYOUTS</text>
      <line x1="306" y1="-4" x2="336" y2="-4" stroke="#f8f7f3" stroke-opacity="0.35"/>
      <text x="352" y="0">ACCOUNTABILITY</text>
    </g>
  </g>

  <!-- Illustrative accounting card -->
  <g filter="url(#cardShadow)">
    <rect x="1010" y="70" width="520" height="320" rx="20" fill="#f8f7f3"/>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="1010" y="70" width="520" height="64" fill="#ede9df"/>
    <text x="1042" y="108" fill="#62665f" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">CAMPAIGN ACCOUNTING</text>
    <text x="1498" y="108" text-anchor="end" fill="#246b50" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">ILLUSTRATIVE</text>

    <text x="1042" y="164" fill="#62665f" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12">Budget</text>
    <text x="1498" y="164" text-anchor="end" fill="#242722" font-family="'SFMono-Regular', Consolas, monospace" font-size="16" font-weight="600">24,800.00</text>

    <text x="1042" y="200" fill="#62665f" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12">Funded</text>
    <text x="1498" y="200" text-anchor="end" fill="#242722" font-family="'SFMono-Regular', Consolas, monospace" font-size="16" font-weight="600">18,200.00</text>

    <text x="1042" y="236" fill="#62665f" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12">Reserved</text>
    <text x="1498" y="236" text-anchor="end" fill="#a64b2a" font-family="'SFMono-Regular', Consolas, monospace" font-size="16" font-weight="600">3,400.00</text>

    <text x="1042" y="272" fill="#62665f" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12">Available</text>
    <text x="1498" y="272" text-anchor="end" fill="#246b50" font-family="'SFMono-Regular', Consolas, monospace" font-size="16" font-weight="700">14,800.00</text>

    <rect x="1042" y="300" width="456" height="12" rx="6" fill="#e7e5de"/>
    <rect x="1042" y="300" width="456" height="12" rx="6" fill="url(#bar)"/>

    <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">
      <circle cx="1047" cy="338" r="4" fill="#d7e3bd"/>
      <text x="1059" y="342" fill="#62665f">FUNDED</text>
      <circle cx="1139" cy="338" r="4" fill="#e9c9a8"/>
      <text x="1151" y="342" fill="#62665f">RESERVED</text>
      <circle cx="1247" cy="338" r="4" fill="#c98f6b"/>
      <text x="1259" y="342" fill="#62665f">SPENT</text>
    </g>
    <text x="1498" y="370" text-anchor="end" fill="#62665f" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10">Demo state · no live funds</text>
  </g>

  <!-- Footer rule -->
  <line x1="88" y1="410" x2="1512" y2="410" stroke="#f8f7f3" stroke-opacity="0.18"/>
  <text x="88" y="436" fill="#f8f7f3" fill-opacity="0.66" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">DEVELOPMENT FOUNDATION · NOT PRODUCTION PAYMENT SOFTWARE</text>
</svg>
