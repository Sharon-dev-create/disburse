services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payout
      POSTGRES_PASSWORD: payout
      POSTGRES_DB: payout_assurance
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout -d payout_assurance"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - payout_pg:/var/lib/postgresql/data
volumes:
  payout_pg:
